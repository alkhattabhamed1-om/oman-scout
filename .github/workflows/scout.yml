name: Scout

# Press "Refresh" on the website (or "Run workflow" on GitHub) to start a scan.
# A weekly thorough scan also runs when the repository variable WEEKLY_REFRESH is set to true.
on:
  workflow_dispatch:
    inputs:
      depth:
        description: "quick (about 15 minutes) or thorough (about 40 minutes, also looks for what was missed and re-checks pages)"
        type: choice
        options: [thorough, quick]
        default: thorough
      model:
        description: Claude model alias for the scan
        required: false
        default: sonnet
  schedule:
    - cron: '0 3 * * 0'

concurrency:
  group: scout
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    if: github.event_name == 'workflow_dispatch' || vars.WEEKLY_REFRESH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: [oman-competitions, oman-events, oman-funding, oman-market, gcc-competitions, gcc-events, global-competitions, global-events]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Check the Claude token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::The secret CLAUDE_CODE_OAUTH_TOKEN is missing. See the README, One-time setup, step 1."
            exit 1
          fi
      - name: Run the scan
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCOUT_MODEL: ${{ inputs.model || 'sonnet' }}
          SCOUT_DEPTH: ${{ inputs.depth || 'thorough' }}
        run: node scripts/run-task.mjs ${{ matrix.task }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: result-${{ matrix.task }}
          path: out/${{ matrix.task }}.json
          if-no-files-found: ignore
          retention-days: 7

  finalize:
    needs: discover
    if: always() && needs.discover.result != 'skipped' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: out
          merge-multiple: true
      - name: Merge the results
        env:
          SCOUT_DEPTH: ${{ inputs.depth || 'thorough' }}
        run: node scripts/merge.mjs
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Add Arabic text
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/translate.mjs
      - name: Save the data
        run: |
          git config user.name "oman-scout[bot]"
          git config user.email "oman-scout@users.noreply.github.com"
          git add data/scout.json data/oman-scout.ics
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update scout data"
            git push
          fi

  deploy:
    needs: finalize
    if: needs.finalize.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
